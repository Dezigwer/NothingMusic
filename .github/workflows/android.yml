name: Android APK

on:
  push:
    branches: [main, android]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null

      # Один и тот же debug-ключ между сборками: иначе новый APK нельзя
      # поставить поверх старого (разные подписи).
      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: nothingmusic-debug-keystore-v1

      # Релизный ключ из секретов: PKCS#12, alias nothingmusic.
      # Если секрета нет (например, сборка из форка) — release подпишется debug-ключом.
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.p12
            echo "SIGNING_KEYSTORE=release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 не задан — release APK подпишется debug-ключом"
          fi

      - name: Build APKs
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Verify release signature
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk \
            | grep -E "Signer #1 certificate DN|APK Signature Scheme"

      - name: Remove keystore
        if: always()
        run: rm -f release.p12

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NothingMusic-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: NothingMusic-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
